*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;margin:0;padding:0;overflow:hidden}body{font-family:"PJS",-apple-system,sans-serif;background:#eef0f4}

/* ── FORM PANEL ── */
.form-panel{position:fixed;left:0;top:0;bottom:0;width:360px;background:#fff;border-right:1px solid #e2e5eb;overflow-y:auto;display:flex;flex-direction:column;z-index:10}
.form-header{padding:18px 22px 14px;background:#0A1628;border-bottom:3px solid #1B4FCC;flex-shrink:0}
.form-header-top{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.form-logo{width:26px;height:26px;background:linear-gradient(135deg,#7B2FD4,#1B4FCC);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:white}
.form-header h1{font-size:14px;font-weight:700;color:white}
.form-header p{font-size:10px;color:rgba(255,255,255,0.4);margin-top:1px}
.form-body{padding:14px 18px 6px;flex:1}
.sec-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#9ca3af;margin-bottom:9px;padding-bottom:5px;border-bottom:1px solid #f3f4f6}
.form-section{margin-bottom:18px}
.field{margin-bottom:9px}
label{display:block;font-size:11px;font-weight:600;color:#000000;margin-bottom:3px}
input[type="text"],input[type="month"],textarea{width:100%;border:1px solid #d1d5db;border-radius:7px;padding:7px 10px;font-size:12px;color:#111827;background:#fff;font-family:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:none;border-color:#1B4FCC;box-shadow:0 0 0 3px rgba(27,79,204,.1)}
textarea{resize:vertical;min-height:58px;line-height:1.5}

/* Template selector */
.tmpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tmpl-btn{border:2px solid #e5e7eb;border-radius:9px;background:#fff;cursor:pointer;padding:8px 5px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all .15s;font-family:inherit;position:relative}
.tmpl-btn:hover{border-color:#93c5fd;background:#f8faff}
.tmpl-btn.active{border-color:#1B4FCC;background:#eff6ff;box-shadow:0 0 0 3px rgba(27,79,204,.1)}
.tmpl-btn.active::after{content:"✓";position:absolute;top:3px;right:5px;font-size:8px;color:#1B4FCC;font-weight:800}
.tmpl-thumb{width:44px;height:54px;display:flex;flex-direction:column;gap:2px}
.tmpl-hdr{width:100%;height:10px;background:linear-gradient(90deg,#e0e7ff,#ede9fe);border-radius:3px}
.tmpl-row{display:flex;gap:2px;flex:1}
.tmpl-ph{width:12px;background:#d1d5db;border-radius:2px;flex-shrink:0}
.tmpl-tx{flex:1;background:#f3f4f6;border-radius:2px}
.tmpl-gal{width:100%;background:#f3f4f6;border-radius:2px;display:flex;gap:2px;padding:2px;align-items:stretch}
.tmpl-gal .tmpl-ph{flex:1;width:auto}
.tmpl-name{font-size:8px;font-weight:700;color:#000000;text-align:center;line-height:1.2}

/* Banner grid */
.banner-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.banner-btn{position:relative;padding:9px 5px 7px;border:2px solid #e5e7eb;border-radius:9px;background:#fff;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;overflow:hidden;font-family:inherit}
.banner-btn:hover{border-color:#93c5fd;background:#f8faff}
.banner-btn.active{border-color:#1B4FCC;box-shadow:0 0 0 3px rgba(27,79,204,.12)}
.banner-btn.active::after{content:"✓";position:absolute;top:3px;right:5px;font-size:8px;color:#1B4FCC;font-weight:800}
.banner-logo-img{max-height:32px;max-width:72px;object-fit:contain;display:block}
.banner-label{font-size:8.5px;font-weight:600;color:#9ca3af;text-align:center}

/* Block card */
.block-card{background:#f9fafb;border:1px solid #e5e7eb;border-radius:9px;padding:12px;margin-bottom:9px}
.block-card-hdr{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.block-num{width:19px;height:19px;border-radius:50%;font-size:9px;font-weight:800;color:white;display:flex;align-items:center;justify-content:center}
.block-card-title{font-size:11px;font-weight:700;color:#000000}
.block-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:auto}
.label-opts{display:flex;gap:4px;flex-wrap:wrap}
.label-opt{padding:3px 8px;border-radius:20px;font-size:9.5px;font-weight:700;cursor:pointer;border:2px solid transparent;transition:transform .1s;font-family:inherit}
.label-opt:hover{transform:scale(1.04)}
.label-opt.selected{border-color:rgba(0,0,0,0.2)}
.img-area{border:2px dashed #d1d5db;border-radius:7px;padding:10px;text-align:center;cursor:pointer;background:#fff;position:relative;overflow:hidden;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:border-color .15s,background .15s}
.img-area:hover{border-color:#1B4FCC;background:#eff6ff}
.img-area input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;font-size:0}
.upload-icon{font-size:15px}
.upload-txt{font-size:10px;color:#000000;line-height:1.4}
.upload-txt strong{color:#1B4FCC}
.img-preview{width:100%;max-height:80px;object-fit:contain;border-radius:5px;display:none}
.rm-btn{font-size:10px;color:#e53935;background:none;border:none;cursor:pointer;margin-top:2px;padding:0;font-family:inherit}

/* Dual upload row */
.dual-upload{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.triple-upload{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

.export-btn{width:calc(100% - 36px);margin:0 18px 14px;padding:10px 16px;background:#0A1628;color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0;transition:background .15s;font-family:inherit}
.export-btn:hover{background:#162a4a}

/* ── PREVIEW PANEL ── */

/* ── SEPARATOR BAR ── */
.nl-separator{display:flex;align-items:center;gap:12px;padding:16px 32px;background:#fff}
.nl-sep-logo{width:40px;height:40px;border-radius:0;object-fit:contain;flex-shrink:0}
.nl-sep-name{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#000}
.nl-sep-line{flex:1;height:1px;background:#e5e7eb;margin:0 8px}
.nl-sep-flag{font-size:22px;flex-shrink:0;line-height:1}

/* ── KPI SECTION ── */
.nl-kpi-section{padding:24px 32px 8px;background:#fff}
.nl-kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.nl-kpi-card{background:#fff;border:1.5px solid #f0f2f5;border-radius:16px;padding:20px 16px 14px;position:relative;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.nl-kpi-badge{position:absolute;top:-11px;left:12px;background:#E91E8C;color:#fff;font-size:9px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.05em;white-space:nowrap}
.nl-kpi-value{font-size:26px;font-weight:800;color:#036672;line-height:1.1;margin-bottom:6px}
.nl-kpi-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#9ca3af}
.nl-kpi-ph{color:#000;opacity:.35;font-style:italic}

/* ── APP VERSION PILL ── */
.nl-app-version{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #d1d5db;border-radius:20px;padding:12px 16px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#000;margin-top:12px;background:#fff}
.av-store-badge{height:22px;width:22px;display:inline-flex;align-items:center;flex-shrink:0}.av-store-badge svg{width:22px;height:22px}
.nl-app-version .av-label{opacity:.6}
.nl-app-version .av-ver{font-weight:800}

/* ── STORE BADGES ── */
.nl-store-badges{display:flex;gap:10px;justify-content:center;margin-top:12px}
.nl-store-badge{height:32px;width:auto;display:block}

/* ── FORMAT PICKER ── */
.fmt-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fmt-btn{border:2px solid #e5e7eb;border-radius:10px;background:#fff;padding:12px 8px;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.fmt-btn.active{border-color:#7B2FD4;background:#faf5ff}
.fmt-btn .fmt-icon{font-size:18px;margin-bottom:4px}
.fmt-btn .fmt-name{font-size:11px;font-weight:700;color:#111;display:block}
.fmt-btn .fmt-desc{font-size:9px;color:#9ca3af;display:block;margin-top:2px}

.preview-panel{position:fixed;left:360px;right:0;top:0;bottom:0;overflow-y:scroll;overflow-x:auto;padding:24px 32px}
.preview-label{font-size:10px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.08em;display:block;width:800px;margin:0 auto 8px;}

/* ── NEWSLETTER ── */
.newsletter{width:800px;min-width:800px;margin:0 auto;background:white;box-shadow:0 2px 20px rgba(0,0,0,.12),0 8px 32px rgba(0,0,0,.06);border-radius:8px;overflow:hidden;font-family:"PJS","Helvetica Neue",Arial,sans-serif}

/* HEADER */
.nl-header{position:relative;line-height:0;padding:48px 32px 0;background:#ffffff}
.nl-header-svg{width:100%;display:block}

/* Brand icon pair (right of Prisma P center) */
.nl-brand-icon{
  position:absolute;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  z-index:4;
  display:flex;
  flex-direction:row;
  align-items:center;
  gap:8px;
}
.nl-prisma-circle{
  width:48px;height:48px;border-radius:50%;object-fit:contain;
  position:relative;z-index:1;
  margin-right:0;
}
.nl-brand-circle{
  width:45px;height:45px;border-radius:50%;
  object-fit:contain;display:block;
  background:white;
  border:2px solid rgba(255,255,255,0.85);
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
  padding:4px;
}
.nl-brand-circle.is-circle{padding:0;object-fit:cover}

/* Text overlay — centered in card area */
.nl-header-text{
  position:absolute;
  top:82px; /* below 20px top + 48px icons + 14px gap */
  left:8%;right:8%;
  z-index:2;
  text-align:center;
}
.nl-eyebrow{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#000000;margin-bottom:14px;padding:16px 16px;border:1.5px solid #d1d5db;border-radius:20px;background:#fff;backdrop-filter:blur(4px)}
.nl-main-title{font-size:45px;font-weight:400;color:#000000;line-height:52px;margin-bottom:12px;letter-spacing:-.01em}
.nl-intro{font-size:14px;font-weight:400;color:#000000;line-height:20px;max-width:480px;margin:0 auto}

/* ── BLOCKS CONTAINER ── */
.nl-body{padding:32px;display:flex;flex-direction:column;gap:32px;background:#ffffff}

/* Standard block */
.nl-block{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch;border-bottom:none;border-radius:20px;position:relative;overflow:hidden}

.nl-block.rev{grid-template-columns:1fr 1fr}
.nl-block.rev .nl-block-text{order:1}
.nl-block.rev .nl-block-img{order:2}
.nl-block-text{padding:28px 32px;position:relative;z-index:1}
/* Phone column: uses device glow SVG as background */
.nl-block-img{
  display:flex;align-items:center;justify-content:center;

.nl-block-desc{font-size:12.5px;color:#000000;line-height:1.65}

/* Phone mockup */
.phone-mockup{width:148px;height:320px;background:#000;border:6px solid #1a1f3c;border-radius:28px;position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.1)}
.phone-mockup::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:40px;height:10px;background:#1a1f3c;border-radius:0 0 8px 8px;z-index:3}
.phone-screen{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.phone-ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#f0f4ff,#f8f5ff);color:#000000;opacity:0.5;gap:6px}
.phone-ph-icon{font-size:22px}
.phone-ph-txt{font-size:9px;color:#000000;opacity:0.5;text-align:center;padding:0 6px}

/* Gallery 2 */
.nl-gal2{position:relative;overflow:hidden;border-radius:20px;padding:0}

.nl-gal2-bg{width:100%;display:block}
.nl-gal2-phones{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:space-around;
  padding:0 64px;
}
.nl-gal2-item{display:flex;flex-direction:column;align-items:center;gap:8px}
.gal-tag-label{font-size:10px;font-weight:600;color:#000000;text-align:center}

/* Gallery 3 */
.nl-gal3{position:relative;overflow:hidden;border-radius:20px;padding:0}

.nl-gal3-bg{width:100%;display:block}
.nl-gal3-overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  padding:28px 32px 0;
  z-index:1;
}
.nl-gal3-text{text-align:center;margin-bottom:16px}
.nl-gal3-icon-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:white;margin-bottom:8px}
.nl-gal3-icon-tag .tag-ring{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,0.8);display:flex;align-items:center;justify-content:center}
.nl-gal3-title{font-size:20px;font-weight:800;color:#000000;line-height:1.15;margin-bottom:4px;letter-spacing:-.02em}
.nl-gal3-subtitle{font-size:13px;font-weight:600;color:#000000;margin-bottom:6px}
.nl-gal3-desc{font-size:12px;color:#000000;line-height:1.6;max-width:480px;margin:0 auto}
.nl-gal3-phones{

}
.nl-gal3-phone-item{display:flex;flex-direction:column;align-items:center;gap:6px}

.nl-footer-svg{width:100%;display:block}

.ph{color:#000000;font-style:italic;opacity:0.5}

/* ── PRINT ── */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html,body{overflow:visible!important;background:white!important;display:block!important;height:auto!important;width:800px!important}
  .form-panel{display:none!important}
  .preview-panel{position:static!important;padding:0!important;overflow:visible!important;display:block!important;background:white!important;left:0!important;width:800px!important}
  .preview-label{display:none!important}
  .newsletter{width:800px!important;min-width:800px!important;box-shadow:none!important;border-radius:0!important;margin:0!important}
  @page{margin:0;size:800px auto}
}

<!-- ══ FORM PANEL ══ -->
<div class="form-panel">
  <div class="form-header">
    <div class="form-header-top">
      <div class="form-logo">P</div>
      <h1>News Prisma</h1>
    </div>
    <p>Generador de comunicados · Proyecto Whitelabel</p>
  </div>

  <div class="form-body">

    <!-- 1. FORMATO -->
    <div class="form-section">
      <div class="sec-title">Tipo de comunicado</div>
      <div class="fmt-grid" id="fmt-grid"></div>
    </div>

    <!-- 2. BANDERA -->
    <div class="form-section">
      <div class="sec-title">Bandera</div>
      <div class="banner-grid" id="banner-grid"></div>
    </div>

    <!-- 3. HEADER -->
    <div class="form-section">
      <div class="sec-title">Header del comunicado</div>
      <div class="field">
        <label>Idioma</label>
        <select id="idioma" onchange="state.idioma=this.value;applyLanguage(this.value)">
          <option value="es" selected>🇪🇸 Español</option>
          <option value="pt">🇧🇷 Português (Brasil)</option>
          <option value="en">🇺🇸 English</option>
        </select>
      </div>
      <div class="field">
        <label>País</label>
        <select id="pais" onchange="selectPais(this.value);renderPreview()">
          <option value="AR">🇦🇷 Argentina</option>
          <option value="BR">🇧🇷 Brasil</option>
          <option value="CL" selected>🇨🇱 Chile</option>
          <option value="CO">🇨🇴 Colombia</option>
          <option value="PE">🇵🇪 Perú</option>
          <option value="US">🇺🇸 EE.UU.</option>
        </select>
      </div>
      <div class="field">
        <label>Mes y año</label>
        <input type="month" id="fecha" oninput="renderPreview()">
      </div>
      <div class="field" id="field-audiencia">
        <label>Audiencia</label>
        <input type="text" id="audiencia" value="Alta Gerencia" placeholder="ej. Alta Gerencia" oninput="state.audiencia=this.value;renderPreview()">
      </div>
      <div class="field" id="field-appversion" style="display:none">
        <label>App Version</label>
        <input type="text" id="appversion" value="2.5.0" placeholder="ej. 2.5.0" oninput="state.appVersion=this.value;renderPreview()">
      </div>
      <div class="field">
        <label>Título principal</label>
        <input type="text" id="titulo" value="Traemos buenas noticias" oninput="renderPreview()">
      </div>
      <div class="field">
        <label>Subtítulo introductorio</label>
        <textarea id="subtitulo" placeholder="Breve descripción del comunicado..." oninput="renderPreview()"></textarea>
      </div>
    </div>

    <!-- 4. KPIs (mailing only) -->
    <div id="kpis-form"></div>

    <!-- 5. BLOCKS (dynamic) -->
    <div id="blocks-form"></div>

  </div><!-- /form-body -->

  <div style="display:flex;flex-direction:column;gap:8px;padding:0 18px 14px">
  <button class="export-btn" id="pdf-btn" onclick="downloadPDF()" style="margin:0;width:100%">⬇&nbsp; Exportar como PDF</button>
  <button class="export-btn" id="png-btn" onclick="downloadPNG()" style="margin:0;width:100%;background:#1a6b5c">🖼&nbsp; Descargar como PNG</button>
</div>
</div>

function applyLanguage(lang) {
  const t = TRANSLATIONS[lang] || TRANSLATIONS['es'];
  // Form field values
  const tituloEl = document.getElementById('titulo');
  if (tituloEl) tituloEl.value = t.titulo;
  const subEl = document.getElementById('subtitulo');
  if (subEl) subEl.placeholder = t.subtitulo_ph;
  const audEl = document.getElementById('audiencia');
  if (audEl) audEl.value = t.audiencia;
  // Export button
  const btn = document.querySelector('.export-btn');
  if (btn) btn.textContent = t.exportBtn;
  // Preview label
  const pvLabel = document.querySelector('.preview-label');
  if (pvLabel) pvLabel.textContent = t.vistaPrevia;
  // Static form section titles
  const secTitles = document.querySelectorAll('.form-section .sec-title');
  secTitles.forEach(el => {
    const txt = el.textContent.trim();
    if (['Tipo de comunicado','Newsletter type','Tipo de comunicado'].includes(txt)) el.textContent = t.secFormato;
    if (['Bandera','Bandeira','Brand flag'].includes(txt)) el.textContent = t.secBandera;
    if (['Header del comunicado','Cabeçalho do comunicado','Newsletter header'].includes(txt)) el.textContent = t.secHeader;
  });
  // Form field labels
  document.querySelectorAll('#idioma').forEach(el => { const lbl = el.closest('.field')?.querySelector('label'); if(lbl) lbl.textContent = t.labelIdioma; });
  document.querySelectorAll('#pais').forEach(el => { const lbl = el.closest('.field')?.querySelector('label'); if(lbl) lbl.textContent = t.labelPais; });
  document.querySelectorAll('#fecha').forEach(el => { const lbl = el.closest('.field')?.querySelector('label'); if(lbl) lbl.textContent = t.labelFecha; });
  document.querySelectorAll('#audiencia').forEach(el => { const lbl = el.closest('.field')?.querySelector('label'); if(lbl) lbl.textContent = t.labelAud; });
  document.querySelectorAll('#appversion').forEach(el => { const lbl = el.closest('.field')?.querySelector('label'); if(lbl) lbl.textContent = t.labelAppVer; });
  document.querySelectorAll('#titulo').forEach(el => { const lbl = el.closest('.field')?.querySelector('label'); if(lbl) lbl.textContent = t.labelTitulo; });
  document.querySelectorAll('#subtitulo').forEach(el => { const lbl = el.closest('.field')?.querySelector('label'); if(lbl) lbl.textContent = t.labelSub; });
  // Translate block labels in state
  state.blocks.forEach((b) => {
    const matched = t.labels.find(l => l.color === b.color);
    if (matched) b.label = matched.text;
    else { b.label = t.labels[0].text; b.color = t.labels[0].color; }
  });
  renderBlockForms();
  renderKpiForm();
  renderPreview();
}

function makeTmplThumb(blocks) {
  let rows = '<div class="tmpl-hdr"></div>';
  blocks.forEach(b => {
    if (b === 'std') {
      rows += '<div class="tmpl-row"><div class="tmpl-ph"></div><div class="tmpl-tx"></div></div>';
    } else if (b === 'gal2') {
      rows += '<div class="tmpl-row" style="flex:1"><div class="tmpl-gal" style="display:flex;gap:2px"><div class="tmpl-ph" style="flex:1;width:auto"></div><div class="tmpl-ph" style="flex:1;width:auto"></div></div></div>';
    } else if (b === 'gal3') {
      rows += '<div class="tmpl-row" style="flex:1;flex-direction:column;gap:2px"><div style="height:8px;background:#e9d5ff;border-radius:2px;width:100%"></div><div style="display:flex;gap:2px;flex:1"><div class="tmpl-ph" style="flex:1;width:auto"></div><div class="tmpl-ph" style="flex:1;width:auto"></div><div class="tmpl-ph" style="flex:1;width:auto"></div></div></div>';
    }
  });
  return rows;
}

// Default block states per type
function defaultBlock(type, idx) {
  if (type === 'std') return {type:'std', label:'Highlights', color:'#E53935', titulo:'', subtitulo:'', desc:'', img:null, waPills:[{pill:'',text:''},{pill:'',text:''}], waBullets:''};
  if (type === 'gal2') return {type:'gal2', imgs:[null,null], tags:['','']};
  if (type === 'gal3') return {type:'gal3', label:'Nueva función', color:'#7C3AED', titulo:'', subtitulo:'', desc:'', imgs:[null,null,null], tags:['','','']};
}

let state = {
  formatId: 'mailing',
  bannerId: 'jumbo',
  paisId: 'CL',
  audiencia: 'Alta Gerencia',
  idioma: 'es',
  appVersion: '2.5.0',
  kpiCount: 6,
    kpis: Array(6).fill(null).map(()=>({val:'',label:'',share:''})),
  blocks: [defaultBlock('std',0)],
};

function selectFormat(id) {
  if (state.formatId === id) return;
  state.formatId = id;
  // Reset blocks to single std block
  state.blocks = [defaultBlock('std', 0)];
  renderFormatPicker(); renderKpiForm(); renderBlockForms(); renderPreview();
}

function selectPais(id) { state.paisId = id; renderPreview(); }

function selectBanner(id) {
  state.bannerId = id;
  renderBannerGrid(); renderPreview();
}

function setLabel(i, t, c) { state.blocks[i].label = t; state.blocks[i].color = c; renderBlockForms(); renderPreview(); }
function setGal3Label(i, t, c) { state.blocks[i].label = t; state.blocks[i].color = c; renderBlockForms(); renderPreview(); }

function handleImg(blockIdx, imgIdx, input) {
  const f = input.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = e => {
    if (imgIdx === null) state.blocks[blockIdx].img = e.target.result;
    else state.blocks[blockIdx].imgs[imgIdx] = e.target.result;
    renderBlockForms(); renderPreview();
  };
  r.readAsDataURL(f);
}
function removeImg(blockIdx, imgIdx) {
  if (imgIdx === null) state.blocks[blockIdx].img = null;
  else state.blocks[blockIdx].imgs[imgIdx] = null;
  renderBlockForms(); renderPreview();
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─── Render template grid ───



// ─── Render banner grid ───
function renderBannerGrid() {
  document.getElementById('banner-grid').innerHTML = BANNER_ORDER.map(id => {
    const b = LOGOS[id], active = state.bannerId === id;
    return `<button class="banner-btn${active?' active':''}"
      style="${active?'background:'+b.bg:''}" onclick="selectBanner('${id}')">
      <img class="banner-logo-img" src="${b.src}" alt="${b.label}">
      <span class="banner-label">${b.label}</span>
    </button>`;
  }).join('');
}

// ─── Render block forms ───
function parseMD(t) {
  if (!t) return '';
  return t
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');
}

              oninput="state.blocks[${i}].waPills[0].text=this.value;renderPreview()"></div>

            <div class="label-opts" style="margin-bottom:6px">
              ${['Salida a producción','Qué incluye'].map(opt=>`<div class="label-opt${d.waPills[1].pill===opt?' selected':''}"
                style="background:${d.waPills[1].pill===opt?'#E91E8C18':'#fff'};color:#E91E8C;${d.waPills[1].pill===opt?'border-color:#E91E8C;':''}"
                onclick="state.blocks[${i}].waPills[1].pill='${opt}';renderBlockForms();renderPreview()">${opt}</div>`).join('')}
            </div>
            <input type="text" value="${esc(d.waPills[1].pill)}" placeholder="o escribe uno personalizado"
              oninput="state.blocks[${i}].waPills[1].pill=this.value;renderPreview()"></div>
          <div class="field"><label>Bullets (1 por línea, **negrita**: texto)</label>
            <textarea rows="4" placeholder="**Creación de listas**: descripción..."
              oninput="state.blocks[${i}].waBullets=this.value;renderPreview()">${esc(d.waBullets)}</textarea></div>
          `:''}
        </div>`;

    } else if (d.type === 'gal2') {
      const tg2 = TRANSLATIONS[state.idioma]||TRANSLATIONS.es;
      inner += `${tg2.gal2Title}</div>
        <div class="block-card">
          <div class="dual-upload">
            ${[0,1].map(pi => `
              <div class="field"><label>${tg2.screenLabel} ${pi+1}</label>
                <div class="img-area">
                  <input type="file" accept="image/*" onchange="handleImg(${i},${pi},this)">
                  ${d.imgs[pi]?`<img src="${d.imgs[pi]}" class="img-preview" style="display:block">`:`<div class="upload-icon">📱</div><div class="upload-txt" style="font-size:9px"><strong>${tg2.uploadBtn}</strong></div>`}
                </div>
                ${d.imgs[pi]?`<button class="rm-btn" onclick="removeImg(${i},${pi})">✕ ${tg2.rmBtn}</button>`:''}
                <div style="margin-top:5px">
                  <input type="text" placeholder="${tg2.tagLabel}" value="${esc(d.tags[pi])}"
                    oninput="state.blocks[${i}].tags[${pi}]=this.value;renderPreview()">
                </div>
              </div>`).join('')}
          </div>
        </div>`;

    } else if (d.type === 'gal3') {
      const tg3 = TRANSLATIONS[state.idioma]||TRANSLATIONS.es;
      inner += `${tg3.gal3Title}</div>
        <div class="block-card">
          <div class="field"><label>${tg3.catLabel}</label>
            <div class="label-opts">${tg3.labels.map(l=>`<div class="label-opt${d.label===l.text?' selected':''}"
              style="background:${l.color}18;color:${l.color};${d.label===l.text?'border-color:'+l.color+';':''}"
              onclick="setGal3Label(${i},'${esc(l.text)}','${l.color}')">${l.text}</div>`).join('')}</div>
          </div>
          <div class="field"><label>${tg3.tituloLabel}</label>
            <input type="text" value="${esc(d.titulo)}" placeholder="${tg3.blockTituloPh}"
              oninput="state.blocks[${i}].titulo=this.value;renderPreview()"></div>
          <div class="field"><label>${tg3.subLabel}</label>
            <input type="text" value="${esc(d.subtitulo)}" placeholder="${tg3.blockSubPh}"
              oninput="state.blocks[${i}].subtitulo=this.value;renderPreview()"></div>
          <div class="field"><label>${tg3.descLabel}</label>
            <textarea placeholder="${tg3.blockDescPh}"
              oninput="state.blocks[${i}].desc=this.value;renderPreview()">${esc(d.desc)}</textarea></div>
          <div class="field"><label>${tg3.screenLabel} (3)</label>
            <div class="triple-upload">
              ${[0,1,2].map(pi => `
                <div>
                  <div class="img-area" style="min-height:52px">
                    <input type="file" accept="image/*" onchange="handleImg(${i},${pi},this)">
                    ${d.imgs[pi]?`<img src="${d.imgs[pi]}" class="img-preview" style="display:block;max-height:52px">`:'<div class="upload-icon" style="font-size:13px">📱</div>'}
                  </div>
                  ${d.imgs[pi]?`<button class="rm-btn" onclick="removeImg(${i},${pi})">✕</button>`:''}
                  <input type="text" placeholder="${tg3.tagLabel} ${pi+1}" value="${esc(d.tags[pi])}" style="margin-top:4px;font-size:10px"
                    oninput="state.blocks[${i}].tags[${pi}]=this.value;renderPreview()">
                </div>`).join('')}
            </div>
          </div>
        </div>`;
    }

    card.innerHTML = inner;
    c.appendChild(card);
  });
}

// ─── Render preview ───
function renderFormatPicker() {
  document.getElementById('fmt-grid').innerHTML = FORMATS.map(f =>
    `<button class="fmt-btn${state.formatId===f.id?' active':''}" onclick="selectFormat('${f.id}')">
      <div class="fmt-icon">${f.icon}</div>
      <span class="fmt-name">${f.name}</span>
      <span class="fmt-desc">${f.desc}</span>
    </button>`
  ).join('');
  // Show/hide format-specific fields
  const isMailing = state.formatId === 'mailing';
  document.getElementById('field-audiencia').style.display = isMailing ? '' : 'none';
  document.getElementById('field-appversion').style.display = isMailing ? 'none' : '';
}

function renderKpiForm() {
  const isMailing = state.formatId === 'mailing';
  const el = document.getElementById('kpis-form');
  if (!isMailing) { el.innerHTML = ''; return; }
  const tk = TRANSLATIONS[state.idioma]||TRANSLATIONS.es;
  // Count selector chips
  const countChips = [3,4,5,6].map(n =>
    `<button onclick="state.kpiCount=${n};renderKpiForm();renderPreview()"
      style="border:1.5px solid ${state.kpiCount===n?'#036672':'#d1d5db'};background:${state.kpiCount===n?'#036672':'#fff'};color:${state.kpiCount===n?'#fff':'#6b7280'};border-radius:20px;padding:4px 14px;font-size:11px;font-weight:700;cursor:pointer">${n}</button>`
  ).join('');
  let html = `<div class="form-section"><div class="sec-title" style="display:flex;align-items:center;justify-content:space-between">KPIs <div style="display:flex;gap:5px">${countChips}</div></div>`;
  state.kpis.slice(0, state.kpiCount).forEach((k, i) => {
    html += `<div style="display:grid;grid-template-columns:1fr 1fr 80px;gap:6px;margin-bottom:8px;align-items:end">
      <div class="field" style="margin:0"><label>${tk.kpiValLabel} ${i+1}</label>
        <input type="text" value="${k.val}" placeholder="${tk.kpiVal_ph}" oninput="state.kpis[${i}].val=this.value;renderPreview()"></div>
      <div class="field" style="margin:0"><label>${tk.kpiLblLabel}</label>
        <input type="text" value="${k.label}" placeholder="${tk.kpiLabel_ph}" oninput="state.kpis[${i}].label=this.value;renderPreview()"></div>
      <div class="field" style="margin:0"><label>${tk.kpiShareLabel}</label>
        <input type="text" value="${k.share}" placeholder="58%" oninput="state.kpis[${i}].share=this.value;renderPreview()"></div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

// ─── Shared canvas capture ───
async function captureNewsletter(scale) {
  const el = document.getElementById('newsletter');
  const fullHeight = el.scrollHeight || el.offsetHeight;
  const fullWidth  = el.scrollWidth  || el.offsetWidth;
  return html2canvas(el, {
    scale: scale || 2,
    useCORS: true,
    allowTaint: true,
    logging: false,
    backgroundColor: '#ffffff',
    width: fullWidth,
    height: fullHeight,
    windowWidth: fullWidth,
    windowHeight: fullHeight,
    scrollX: 0,
    scrollY: -window.scrollY,
    onclone: function(clonedDoc) {
      // html2canvas cannot render inline SVG — replace store badge SVGs with PNG imgs
      const badges = clonedDoc.querySelectorAll('.av-store-badge');
      if (badges.length >= 2) {
        badges[0].innerHTML = '<img src="' + STORE_BADGES.appStore + '" width="22" height="22" style="display:block">';
        badges[1].innerHTML = '<img src="' + STORE_BADGES.playStore + '" width="22" height="22" style="display:block">';
      }
    }
  });
}

// ─── PDF Export (single page, canvas-based) ───
async function downloadPDF() {
  const btn = document.getElementById('pdf-btn');
  const orig = btn.textContent;
  btn.textContent = 'Generando PDF...'; btn.disabled = true;
  try {
    const canvas = await captureNewsletter(2);
    const imgData = canvas.toDataURL('image/png');
    // Page size in mm matching canvas proportions
    const pxToMm = 0.264583;
    const pageW = canvas.width * pxToMm / 2;  // divide by scale
    const pageH = canvas.height * pxToMm / 2;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: pageW > pageH ? 'l' : 'p', unit: 'mm', format: [pageW, pageH] });
    doc.addImage(imgData, 'PNG', 0, 0, pageW, pageH);
    const banner = document.querySelector('.nl-sep-name')?.textContent || 'news';
    doc.save(`news-prisma-${banner.toLowerCase()}.pdf`);
  } catch(e) { alert('Error al generar PDF: ' + e.message); }
  btn.textContent = orig; btn.disabled = false;
}

// ─── PNG Export ───
async function downloadPNG() {
  const btn = document.getElementById('png-btn');
  const orig = btn.textContent;
  btn.textContent = 'Generando...'; btn.disabled = true;
  try {
    const canvas = await captureNewsletter(2);
    const link = document.createElement('a');
    const banner = document.querySelector('.nl-sep-name')?.textContent || 'news';
    link.download = `news-prisma-${banner.toLowerCase()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch(e) { alert('Error al generar PNG: ' + e.message); }
  btn.textContent = orig; btn.disabled = false;
}

// ─── Pre-convert store badge SVGs → PNG for html2canvas ───
const BADGE_PNG = { appStore: null, playStore: null };
function svgImgToPng(svgUri, size) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      c.getContext('2d').drawImage(img, 0, 0, size, size);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => resolve(null);
    img.src = svgUri;
  });
}
Promise.all([
  svgImgToPng(STORE_BADGES.appStore, 44),
  svgImgToPng(STORE_BADGES.playStore, 44)
]).then(([a, p]) => {
  BADGE_PNG.appStore = a;
  BADGE_PNG.playStore = p;
});
